<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.o{fill:none;stroke:#14101F;stroke-width:10;stroke-linecap:round;stroke-dasharray:90;stroke-dashoffset:90;animation:o 1.4s cubic-bezier(.22,1,.36,1) infinite}
.s{fill:#FF6A13;transform-origin:49px 15px;transform:scale(0);animation:s 1.4s cubic-bezier(.34,1.56,.64,1) infinite}
@keyframes o{0%{stroke-dashoffset:90}55%,100%{stroke-dashoffset:0}}
